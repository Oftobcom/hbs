# Базовая физиология здорового взрослого.
# Все давления — мм рт. ст., объёмы — мл, потоки — мл/с,
# сопротивления — мм рт. ст.·с/мл, эластанс — мм рт. ст./мл.

heart:
  # --- ЧСС ---
  hr: 70
  hr_min: 30
  hr_max: 130

  # --- Эластанс предсердий ---
  E_max_la: 0.25
  E_min_la: 0.10
  E_max_ra: 0.20
  E_min_ra: 0.06

  # --- Эластанс желудочков ---
  E_max_lv: 3.5
  E_min_lv: 0.03
  E_max_rv: 0.8
  E_min_rv: 0.03

  # --- Мёртвые объёмы (unstressed) ---
  V0_la: 10
  V0_lv: 10
  V0_ra: 5
  V0_rv: 10

  # --- Конечно-диастолические объёмы (начальное условие) ---
  EDV_la: 80.0
  EDV_lv: 120.0
  EDV_ra: 80.0
  EDV_rv: 120.0

  # --- Сопротивления клапанов ---
  R_mitral: 0.03
  R_aortic: 0.10
  R_tricuspid: 0.03
  R_pulmonary: 0.05
  R_venous_sys:  0.05   # системный венозный возврат (SVC/IVC → RA)
  R_venous_pulm: 0.02   # пульмональный (PV → LA), низкорезистивный

  # --- Клапанная кинетика ---
  k_valve: 9.0

lungs:
  R1: 0.06
  R2: 0.04
  C1: 4.0
  C2: 8.0
  flow_dependent_resistance: true
  flow_sensitivity: 0.15
  Q_norm: 80.0
  k_flow: 9.0
  recruitment_enabled: true
  P_recruit_50: 20.0
  n_recruit: 3.0
  f_recruit_min: 0.55
  # --- ремоделирование ---
  pressure_remodel: false
  P_pa_threshold: 25.0
  pressure_sensitivity: 0.04
  R_remodel_max: 5.0
  tau_remodel: 200.0

baroreflex:
  P_set: 80.0
  HR_base: 70.0
  gain: 0.015
  tau: 2.0
  k_inotropy: 1.5

blood:
  V0: 5800.0
  initial_concentrations:
    tox: 0.0
    bilirubin: 0.5
    ammonia: 0.3
    albumin: 4.5
    glucose: 5.0
    oxygen: 0.15
    co2: 0.52
    lactate: 0.10

peripheral:
  R_base: null          # null → auto-resolve под target_MAP/target_CO
  C_tissue: 8.0
  P_tissue0: 15.0
  O2_norm: 0.15
  k_O2_autoreg: 1.0
  R_min_factor: 0.45
  tau_autoreg: 3.0
  k_P_myogenic: 0.002
  P_sa_norm: 90.0
  R_max_factor: 2.5
  P_myogenic_deadband: 10.0
  VO2_base: 1.5
  VO2_basal_frac: 0.05
  V_tissue_eff: 400.0
  C_a_O2_norm: 0.20
  C_O2_lactate_threshold: 0.08
  k_lactate_prod: 0.05
  k_lactate_clear: 0.02
  k_lactate_release: 0.05
  C_lactate0: 0.10
  C_O2_local0: 0.10

liver:
  R_ha: 17.0
  R_pv_base: 0.25
  R_hv_base: 0.12
  C: 5.0
  C_portal: 1.5
  P_hv0: 8.0
  P_portal0: 8.0
  albumin_prod_base: 0.1
  bilirubin_clearance_base: 0.2
  ammonia_clearance_base: 0.15
  lactate_clearance_base: 0.05
  k_uptake_bil: 0.1
  k_uptake_amm: 0.1
  k_deg_alb: 0.01
  k_release_alb: 0.05
  k_lac_clear: 2.0

kidney:
  GFR_base: 120.0
  P_autoreg: 95.0
  autoreg_amplitude: 0.6
  autoreg_slope: 0.025
  toxin_clearance_frac: 0.2
  volume_reabsorption_frac: 0.99
  RBF_target: 20.0

brain:
  R_base: 7.0
  C: 4.0
  P_autoreg: 80.0
  CMRO2_target: 0.55
  C_v_min: 0.06
  max_extraction: 0.60
  glucose_extraction: 0.1
  P0: 47.5
  C_a_O2_norm: 0.20
  C_a_CO2_norm: 0.50
  k_hypoxic_dilation: 0.6
  k_hypercapnic_dilation: 1.2
  k_myo: 0.30
  V_tissue: 150.0
  RQ: 0.85
  C_O2_critical: 0.08
  # Лактат
  C_lac_norm: 0.15
  k_lac_prod: 0.08
  k_lac_clear: 0.02
  k_lac_release: 0.03
  # Аммиак BBB
  C_amm_norm: 0.3
  k_amm_bbb_in: 0.02
  k_amm_bbb_out: 0.01
  k_amm_detox: 0.01
  k_amm_inhibition: 0.15

gitract:
  R_art: 1.8
  R_cap: 1.2
  R_venous: 1.5
  C_art: 2.0
  C_cap: 5.0
  k_absorption_water: 0.1
  k_absorption_nutrients: 0.05
  portal_pressure_sensitivity: 0.02
  P_art0: 60.0
  P_cap0: 20.0

gas_exchange:
  P_alv_O2: 100.0
  P_alv_CO2: 40.0
  Hb: 15.0
  P50: 26.8
  n_hill: 2.7
  alpha_O2: 0.003
  C_CO2_offset: 0.22
  k_CO2_slope: 0.0065

systemic:
  target_MAP: 85.0
  target_CO: 83.0
  C_sys_art: 1.5
  C_pul_ven: 15.0
  P_sa0: 85.0
  P_sv0: 12.0
  P_pv0: 12.0
  SYS_VEN_FRACTION: 0.58
  C_sys_ven_eff: 550.0
  tau_target: 300.0
  VO2_rest: 1.9          # мл/с — сердце + печень + почки + ЖКТ
  RQ: 0.8                # дыхательный коэффициент
  occlusion_factor: 1.0  # 1.0 = норма (для сценариев инсульта)
  fluid_intake_rate: 0.02
  insensible_loss_rate: 0.0

simulation:
  method: LSODA
  rtol: 1e-4
  atol: 1e-5
  max_step: 0.1
  t_calib: 600.0
  t_span: [0.0, 1800.0]
  n_samples_t: 12001
  t_start_stationary: 600.0
  stationary_rel_tol: 0.10
  stationary_rel_tol_stage1: 0.01

jugular_vein:
  C: 20.0                # комплаенс, мл/мм рт.ст.
  P0: 6.0                # базовое давление, мм рт.ст.
  V0: 290.0              # объём при P0 (≈5% от V0 крови)
  R_out: 0.5             # сопротивление оттока в системные вены
  target_fraction: 0.05
  tau_target: 300.0
  C_O2_init: 0.12        # мл/мл, SjvO2 ≈ 60%
  C_CO2_init: 0.56
  Hb: 15.0